# This file describes a plugin for use in CrafterCMS
# The version of the format for this file
descriptorVersion: 2

# Describe the plugin
plugin:
  type: site
  id: org.craftercms.examples
  name: Example Plugins
  tags:
    - authoring
    - tools
  version:
    major: 1
    minor: 0
    patch: 0
  description: Demonstrates a plugin that shows how to override translations in CrafterCMS
  documentation: 'https://raw.githubusercontent.com/craftercms/authoring-ui-plugin-examples/master/README.md'
  website:
    name: Example Plugins
    url: https://github.com/craftercms/authoring-ui-plugin-examples
  media:
    screenshots:
      - title: Translations Plugin
        description: CrafterCMS Translations Plugin
        url: 'https://raw.githubusercontent.com/craftercms/chatgpt-plugin/main/.crafter/logo.png'
  developer:
    company:
      name: CrafterCMS
      email: info@craftercms.com
      url: https://craftercms.com
  build:
    id: kabeb4b44e6a24b5e0481c6ba97901d0b02716c9
    date: 2024-01-20T00:00:00Z
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  crafterCmsVersions:
    - major: 4
      minor: 1
      patch: 2
    - major: 4
      minor: 1
      patch: 3
    - major: 4
      minor: 1
      patch: 4
    - major: 4
      minor: 2
      patch: 0
    - major: 4
      minor: 2
      patch: 1
    - major: 4
      minor: 2
      patch: 2
  crafterCmsEditions:
    - community
    - enterprise
  installation:
    - type: preview-app
      parentXpath: //widget[@id='craftercms.components.ToolsPanel']
      elementXpath: //widget[@id='org.craftercms.examples.translations']
      element:
        name: configuration
        children:
          - name: widgets
            children:
              - name: widget
                attributes:
                  - name: id
                    value: org.craftercms.examples.translations
                children:
                  - name: plugin
                    attributes:
                      - name: id
                        value: org.craftercms
                      - name: type
                        value: examples
                      - name: name
                        value: library
                      - name: file
                        value: index.js
